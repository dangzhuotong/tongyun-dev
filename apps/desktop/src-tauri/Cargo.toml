[package]
name = "tongyun-dev-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "tongyun-dev desktop shell"

[lib]
name = "tongyun_dev_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tongyun-dev-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tongyun-dev-core = { path = "../../../crates/tongyun-dev-core" }
