# tongyun-dev 项目配置
#
# 还没有项目？在 App 里点「扫描目录…」，或运行 `tongyun-dev scan ~/code --apply`，
# 会自动认出 Spring Boot / Tomcat / Vite / Vue / Next / Nuxt / Python 等项目并写到这里。
# 也可以照 config/projects.example.toml 手写。
#
# 字段说明：
#   name        显示名（例如 "示例应用"）
#   root        项目根目录路径（支持 ~ 或绝对路径，例如 "~/code/example-app"）
#   port        服务监听端口（启用的项目端口必须大于 0）
#   enabled     是否启用，缺省 true。false 时桌面列表变灰并显示 reason
#   reason      enabled = false 时的说明原因（必填）
#   start       启动命令数组（例如 ["pnpm", "dev"] 或 ["mvn", "spring-boot:run"]）
#   stop        停止命令数组（可选；未配置时按 PID 进程组和端口监听停止）
#   background  true：命令放到后台进程组，stdout/stderr 追加到日志，PID 写入 pid 文件
#   login_url   就绪探针 URL（可选；HTTP 200/301/302 视为就绪）
#   health_url  健康探针 URL（可选；未配置 login_url 时使用）
#   java        Java 版本（可选，如 "8"、"17"）。App 会自动找到对应版本并设置 JAVA_HOME / PATH，不需要 sdkman/fnm 命令。
#   node        Node 版本（可选，如 "22"）。App 会自动找到对应版本并设置 PATH，不需要 sdkman/fnm 命令。
#   java_home / node_home  可选，显式指定安装目录（Windows 或特殊安装时用）
#   shell       可选，单条命令用哪个 shell 执行：bash（macOS/Linux 默认）、sh、cmd（Windows 默认）、powershell
#   start_windows / stop_windows  可选，Windows 上优先使用的启动 / 停止命令数组
#   log_file    日志文件路径（可选，默认 ~/.tongyun-dev/logs/<id>.out）
#   pid_file    PID 文件路径（可选，默认 ~/.tongyun-dev/logs/<id>.pid）
#   auto_install  可选，缺省 true。根目录有 package.json 但缺 node_modules 时，启动前先自动装依赖（按锁文件选 pnpm / yarn / npm）；false 时只提示「依赖未安装」
#   port_mode   端口传递方式（可选，缺省 "none"）：
#                 "none"   不向命令追加端口，也不注入环境变量；端口仅用于探活（默认，适用于 monorepo 或自有端口配置项目）
#                 "arg"    启动时自动在命令末尾追加端口参数（pnpm/yarn 追加 `--port N`，npm run 追加 `-- --port N`）
#                 "env"    启动时向子进程注入 PORT=N 环境变量（例如 Next/Nuxt/Express）
#                 "config" 端口配置在项目自身文件（如 vite.config 等），行为同 none
#   port_arg    port_mode="arg" 时的参数名（可选，缺省 "--port"，可自定义为 "-p" 等）
#   port_env    port_mode="env" 时的环境变量名（可选，缺省 "PORT"，可自定义为 "VITE_PORT" 等）

[projects]
