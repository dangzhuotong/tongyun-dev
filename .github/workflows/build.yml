name: Desktop build

# Optional unsigned artifact build. Does not create a GitHub Release and does
# not write latest.json. Official installers are published by release.yml on
# tags v*. Pushes to main stay on check.yml and do not package installers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            rust-targets: ""
            installers: |
              target/release/bundle/nsis/*-setup.exe
              target/release/bundle/msi/*.msi
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            installers: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            args: --bundles appimage,deb
            rust-targets: ""
            installers: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Linux webkit dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - run: npm ci

      # `working-directory` applies only to `run` steps. projectPath is from the repo root.
      # Unsigned build: no signing secrets and no GitHub release token.
      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      # Cargo workspace output is <repo>/target, not apps/desktop/src-tauri/target.
      - uses: actions/upload-artifact@v4
        with:
          name: tongyun-dev-${{ matrix.os }}
          path: ${{ matrix.installers }}
          retention-days: 7
          if-no-files-found: error
