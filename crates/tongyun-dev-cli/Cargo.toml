[package]
name = "tongyun-dev-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "tongyun-dev CLI: start/stop/status/logs for local projects"

[[bin]]
name = "tongyun-dev"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tongyun-dev-core = { path = "../tongyun-dev-core" }
