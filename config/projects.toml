# 本机项目注册。路径用 ~ 或绝对路径。不要写口令。
# CLI 会展开 ~ / $HOME，并替换 {{root}} {{tomcat}} {{log_dir}}。
#
# 字段：
#   enabled     缺省 true。false 时不出现在桌面列表，start 会拒绝并带上 reason。
#   reason      enabled=false 时必填。
#   background  true：mvn / pnpm 放后台，日志追加到 log，pid 写入 pid 文件。
#   login_url   可选。HTTP 200/301/302 才算就绪（td_work 登录页）。
#   health_url  可选。没写 login_url 时用它做同样的 HTTP 探针。
#   两者都空    端口能连上即算就绪。
#   log_file / pid_file / log_dir 可省略，默认 ~/code/_index/logs/<id>.out 与 .pid。
# Tomcat 项目要写 tomcat 和 stop。Spring / pnpm 的 stop 可省略：按 pid 进程组停，并清掉本端口监听。
#
# 目录按 ~/code/testdaily/<产品线>/<仓库>。
# 02-ap 的 whitepaper、whitepaper-next、admin-test-center、admin-test-center-vue，
# 以及 03-lj-class 的 lj-class-admin-web，文件夹名按仓库名假定。checkout 不同就只改 root。

[projects.td_work]
name = "td_work"
root = "~/code/testdaily/tdprojects"
start = ["bash", "{{root}}/scripts/start-td-work.sh"]
stop = ["bash", "{{tomcat}}/bin/catalina.sh", "stop", "15", "-force"]
tomcat = "~/opt/apache-tomcat-9.0.98"
log_dir = "~/code/_index/logs"
log_file = "{{log_dir}}/td_work_catalina.out"
pid_file = "{{log_dir}}/td_work_tomcat.pid"
port = 8080
login_url = "http://127.0.0.1:8080/td_work/admin/login.html"

[projects.td_new_toefl]
name = "td_new_toefl"
root = "~/code/testdaily/01-new-toefl/td_new_toefl"
port = 8034
background = true
start = ["bash", "-c", '''
set -euo pipefail
source "$HOME/.sdkman/bin/sdkman-init.sh"
if ! java -version 2>&1 | grep -Eq '1\.8'; then
  java_dir="$HOME/.sdkman/candidates/java"
  if [ ! -d "$java_dir" ]; then
    echo "sdkman java candidates not found" >&2
    exit 1
  fi
  id=$(find "$java_dir" -mindepth 1 -maxdepth 1 -type d -name '8.*' 2>/dev/null | head -n 1 || true)
  id=$(basename "$id")
  if [ -z "$id" ] || [ "$id" = "." ]; then
    echo "sdkman has no installed Java 8" >&2
    exit 1
  fi
  sdk use java "$id"
fi
exec mvn spring-boot:run -Dspring-boot.run.profiles=dev
''']

