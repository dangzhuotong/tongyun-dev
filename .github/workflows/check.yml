name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Process tools for integration tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lsof psmisc
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p tongyun-dev-core -p tongyun-dev-cli
  desktop:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo check --locked -p tongyun-dev-desktop
