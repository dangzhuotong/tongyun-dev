[package]
name = "tongyun-dev-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared start/stop/status/log core for the tongyun-dev CLI and desktop shell"

[dependencies]
anyhow = "1"
chacha20poly1305 = "0.10"
dirs = "5"
hkdf = "0.12"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
toml_edit = "0.22"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
